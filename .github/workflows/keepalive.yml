name: Neon Database Keepalive

on:
  schedule:
    # Runs at 00:00 every 3 days (keeps Neon project active)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  ping-db:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cleanup & Wake DB
        run: |
          curl -i -X POST "${{ secrets.APP_URL }}/api/cron/purge-deleted-accounts" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
          -H "Content-Type: application/json"
